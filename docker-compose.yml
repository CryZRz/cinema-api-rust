services:
  cinema-db:
    image: postgres:16-alpine
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_DB: cinema_db
    ports:
      - "5433:5432"
    volumes:
      - cinema_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_user -d cinema_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  cinema-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cinema_user:cinema_password@cinema-db:5432/cinema_db
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      cinema-db:
        condition: service_healthy

volumes:
  cinema_db_data:
