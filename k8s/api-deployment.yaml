apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-api
  namespace: cinema-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cinema-api
  template:
    metadata:
      labels:
        app: cinema-api
    spec:
      containers:
        - name: cinema-api
          image: cinema-api-rust:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_HOST
              valueFrom:
                configMapKeyRef:
                  name: cinema-config
                  key: SERVER_HOST
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: cinema-config
                  key: SERVER_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cinema-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
